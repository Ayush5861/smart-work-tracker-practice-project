
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Work Tracker</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <header class="bg-blue-600 text-white p-5">
    <h1 class="text-2xl font-bold">
      Smart Work Tracker
    </h1>
  </header>

  <main class="p-4">

    <section class="mb-8">

      <h2 class="text-xl font-bold mb-4">
        Dashboard
      </h2>

      <div class="grid grid-cols-4 gap-4">

        <div class="bg-white p-5 border rounded">
          <p>Total Tasks</p>
          <p class="total-tasks text-2xl font-bold">0</p>
        </div>

        <div class="bg-white p-5 border rounded">
          <p>Todo</p>
          <p class="todo-tasks text-2xl font-bold">0</p>
        </div>

        <div class="bg-white p-5 border rounded">
          <p>In Progress</p>
          <p class="progress-tasks text-2xl font-bold">0</p>
        </div>

        <div class="bg-white p-5 border rounded">
          <p>Completed</p>
          <p class="completed-tasks text-2xl font-bold">0</p>
        </div>

      </div>

    </section>

    <section class="bg-white p-5 border rounded mb-8">

      <h2 class="text-xl font-bold mb-4">
        Search & Filters
      </h2>

      <div class="grid grid-cols-4 gap-4">

        <input
          type="text"
          placeholder="Search title or assignee"
          class="search-input border p-2 rounded"
        >

        <select class="status-filter border p-2 rounded">
          <option value="">All Status</option>
          <option value="Todo">Todo</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>

        <select class="priority-filter border p-2 rounded">
          <option value="">All Priority</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>

        <select class="tag-filter border p-2 rounded">
          <option value="">All Tags</option>
          <option value="Frontend">Frontend</option>
          <option value="Backend">Backend</option>
          <option value="React">React</option>
          <option value="API">API</option>
          <option value="Bug">Bug</option>
        </select>

      </div>

    </section>

    <section class="mb-8">

      <h2 class="text-xl font-bold mb-4">
        Task List
      </h2>

      <div class="bg-white border rounded overflow-hidden">

        <table class="w-full border-collapse">

          <thead class="bg-gray-200">

            <tr>
              <th class="border p-3 text-left">Task ID</th>
              <th class="border p-3 text-left">Title</th>
              <th class="border p-3 text-left">Assignee</th>
              <th class="border p-3 text-left">Status</th>
              <th class="border p-3 text-left">Priority</th>
              <th class="border p-3 text-left">Tags</th>
              <th class="border p-3 text-left">Action</th>
            </tr>

          </thead>

          <tbody class="task-list"></tbody>

        </table>

      </div>

    </section>

    <section class="bg-white p-5 border rounded add-or-edit-form">

      <h2 class="add-task-text text-xl font-bold mb-4">
        Add Task
      </h2>

      <div class="grid grid-cols-2 gap-4">

        <input
          type="number"
          placeholder="Task ID"
          class="task-id border p-2 rounded"
        >

        <input
          type="text"
          placeholder="Title"
          class="task-title border p-2 rounded"
        >

        <input
          type="text"
          placeholder="Assignee"
          class="task-assignee border p-2 rounded"
        >

        <select class="task-status border p-2 rounded">
          <option value="Todo">Todo</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>

        <select class="task-priority border p-2 rounded">
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>

        <input
          type="text"
          placeholder="Tags: Frontend, React"
          class="task-tags border p-2 rounded"
        >

      </div>

      <button
        class="add-task-btn bg-green-600 text-white px-4 py-2 rounded mt-4"
      >
        Add Task
      </button>

    </section>

  </main>

  <script src="practice.js"></script>

</body>
</html>
